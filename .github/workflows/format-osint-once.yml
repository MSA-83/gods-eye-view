name: Temporary OSINT provider formatter

on:
  push:
    branches:
      - chore/format-osint-adapters-2026-11-17

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format adopted runtime source
        run: npm run format -- --write
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/providers/space/swpc.js server/providers/conflict/ucdp.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format OSINT provider adapters"
            git push
          fi
