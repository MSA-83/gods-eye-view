name: Refresh dependency lockfile

on:
  push:
    branches:
      - deps/upgrade-auditable-security-fixes-2026-11-17

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor == 'MSA-83'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the owned dependency branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Resolve compatible security updates without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit the regenerated lockfile to this branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: regenerate lockfile with patched transitive packages"
          git push origin HEAD
